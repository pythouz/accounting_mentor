name: Run Accounting Bot

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger
  schedule:
    - cron: '0 */5 * * *' # Restarts every 5 hours to bypass the 6-hour limit

concurrency:
  group: accounting-bot-single-instance
  cancel-in-progress: true # يلغي أي تشغيل قديم شغال قبل ما يبدأ التشغيل الجديد، عشان منبقاش عندنا نسختين بتعملوا polling على نفس التوكن مع بعض

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Bot
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        # طبقة حماية إضافية: لو Python process كله وقع (مش استثناء عادي، زي انهيار
        # كامل أو OOM)، bash بيعيد تشغيله فورًا تاني من غير أي تدخل بشري.
        until python main.py; do
          echo "⚠️ البوت وقف بشكل غير متوقع. جاري إعادة التشغيل بعد 5 ثواني..."
          sleep 5
        done
